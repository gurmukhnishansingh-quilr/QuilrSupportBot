apiVersion: apps/v1
kind: Deployment
metadata:
  name: quilly-support
  namespace: quilly-support
  labels:
    app: quilly-support
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quilly-support
  template:
    metadata:
      labels:
        app: quilly-support
    spec:
      containers:
        - name: quilly-support
          image: localhost:32000/quilly-support:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: ADMIN_PASSWORD
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: OAUTH_CLIENT_ID
                  optional: true
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: OAUTH_CLIENT_SECRET
                  optional: true
            - name: OAUTH_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: OAUTH_TENANT_ID
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: GOOGLE_REDIRECT_URI
                  optional: true
            - name: MICROSOFT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: MICROSOFT_CLIENT_ID
                  optional: true
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: MICROSOFT_CLIENT_SECRET
                  optional: true
            - name: MICROSOFT_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: MICROSOFT_TENANT_ID
                  optional: true
            - name: MICROSOFT_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: quilly-support-secret
                  key: MICROSOFT_REDIRECT_URI
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: documents
              mountPath: /app/documents
            - name: images
              mountPath: /app/images
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: quilly-data
        - name: documents
          persistentVolumeClaim:
            claimName: quilly-documents
        - name: images
          persistentVolumeClaim:
            claimName: quilly-images
